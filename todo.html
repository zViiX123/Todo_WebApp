<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Board Studio</title>
    <style>
        :root {
            --bg-main: #241735; --bg-col: #31224A; --bg-col-head: #3D2A5C;
            --bg-card: #4A3570; --bg-card-hover: #5B4386;
            --text-light: #F1E9FF; --text-muted: #B9A6DE;
            --btn-bg: #5B4386; --btn-hover: #7657B8;
            --danger: #C1667F; --entry-bg: #3D2A5C; --entry-fg: #F1E9FF;
            --pri-high: #E06C75; --pri-med: #E5A66F; --pri-low: #6FA8E5; --pri-none: transparent;
        }

        body {
            margin: 0; padding: 0; background: var(--bg-main); color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        header {
            background: var(--bg-col-head); padding: 16px 24px;
            font-size: 20px; font-weight: bold; display: flex; justify-content: space-between;
        }

        #board {
            display: flex; gap: 16px; padding: 20px; overflow-x: auto; flex-grow: 1; align-items: flex-start;
        }

        .column {
            background: var(--bg-col); border-radius: 8px; width: 280px; min-width: 280px;
            display: flex; flex-direction: column; max-height: 100%;
        }
        .column.col-dragging { opacity: 0.4; border: 2px dashed var(--text-muted); }

        .col-header {
            background: var(--bg-col-head); padding: 12px 16px; border-radius: 8px 8px 0 0;
            display: flex; justify-content: space-between; align-items: center; font-weight: bold;
        }

        .col-count { background: var(--btn-bg); padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        
        .col-btn-group { display: flex; gap: 12px; align-items: center; margin-right: 12px; }
        
        .icon-btn {
            background: transparent; border: none; font-weight: bold;
            cursor: pointer; padding: 0; display: inline-flex; align-items: center; justify-content: center;
            transition: text-shadow 0.2s, color 0.2s;
        }
        .icon-btn.add { color: #51A15F; font-size: 16px; width: 20px; height: 20px; }
        .icon-btn.add:hover { color: #6BE87F; text-shadow: 0 0 8px rgba(107, 232, 127, 0.8); }
        .icon-btn.del { color: #A64D4D; font-size: 24px; width: 26px; height: 26px; } /* Noticeably larger X */
        .icon-btn.del:hover { color: #E86B6B; text-shadow: 0 0 8px rgba(232, 107, 107, 0.8); }

        .tiny-color-picker {
            width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.2);
            overflow: hidden; cursor: pointer; display: inline-block; position: relative;
        }
        .tiny-color-picker:hover { border-color: rgba(255,255,255,0.6); }
        .tiny-color-picker input[type="color"] {
            position: absolute; top: -5px; left: -5px; width: 24px; height: 24px; cursor: pointer; border: none;
        }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
        .card-title { font-size: 14px; font-weight: bold; word-wrap: break-word; margin: 0; }
        
        .card-del-btn {
            background: transparent; border: none; color: #A64D4D; font-size: 14px; font-weight: bold;
            cursor: pointer; padding: 0; opacity: 0; transition: opacity 0.2s;
        }
        .card:hover .card-del-btn { opacity: 1; } 
        
        .card-list {
            padding: 8px; overflow-y: auto; flex-grow: 1; min-height: 50px;
        }

        .card {
            background: var(--bg-card); border-radius: 6px; padding: 12px; margin-bottom: 8px;
            cursor: pointer; 
            border: 1px solid #000000; /* Added the black outline */
            border-left: 4px solid var(--pri-none);
        }
        .card:hover { filter: brightness(1.2); }
        .card.dragging { opacity: 0.5; }
        
        .progress-bg { background: var(--entry-bg); height: 6px; border-radius: 3px; margin-top: 8px; overflow: hidden;}
        .progress-fill { height: 100%; background: var(--pri-med); transition: width 0.3s; }
        .progress-fill.done { background: #7FCB8E; }

        .add-list-btn {
            background: var(--entry-bg); color: var(--text-light); border: none; padding: 12px 16px;
            border-radius: 8px; width: 280px; min-width: 280px; text-align: left; cursor: pointer;
        }
        .add-list-btn:hover { filter: brightness(1.2); }

        /* Modal Styles */
        dialog {
            background: var(--bg-main); color: var(--text-light); border: 1px solid var(--bg-col-head);
            border-radius: 8px; padding: 24px; width: 450px; max-width: 90%;
        }
        dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
        .modal-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 4px; }
        .modal-group label { color: var(--text-muted); font-size: 12px; font-weight: bold; }
        input, select, textarea {
            background: var(--entry-bg); color: var(--entry-fg); border: none; padding: 8px;
            border-radius: 4px; font-family: inherit; font-size: 14px;
        }
        textarea { resize: vertical; min-height: 60px; }
        button.primary { background: var(--btn-bg); color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        button.danger { background: var(--danger); color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        
        .chk-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .chk-item input[type="checkbox"] { width: 16px; height: 16px; }
        .chk-item button { background: transparent; border: none; color: var(--danger); cursor: pointer; }
    </style>
</head>
<body>

    <header>✦ Todo Board Studio</header>
    <div id="board"></div>

    <!-- Edit Task Modal -->
    <dialog id="taskModal">
        <input type="hidden" id="editId">
        
        <div class="modal-group">
            <input type="text" id="editTitle" style="font-size: 18px; font-weight: bold; border-bottom: 2px solid var(--entry-bg); background: transparent; padding: 0 0 8px 0;">
        </div>

        <div style="display: flex; gap: 12px;">
            <div class="modal-group" style="flex: 1;">
                <label>List</label>
                <select id="editCol"></select>
            </div>
            <div class="modal-group" style="flex: 1;">
                <label>Priority</label>
                <select id="editPri">
                    <option value="None">None</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>
        </div>

        <div class="modal-group">
            <label>Description</label>
            <textarea id="editDesc"></textarea>
        </div>

        <div class="modal-group">
            <label>Checklist</label>
            <div id="chkContainer"></div>
            <div style="display: flex; gap: 8px; margin-top: 8px;">
                <input type="text" id="newChkInput" placeholder="Add an item..." style="flex: 1;" onkeypress="if(event.key === 'Enter') addChecklistItem()">
                <button class="primary" type="button" onclick="addChecklistItem()">Add</button>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; margin-top: 24px;">
            <button class="danger" onclick="deleteTask()">Delete Card</button>
            <div style="display: flex; gap: 8px;">
                <button class="primary" style="background: transparent; color: var(--text-light);" onclick="document.getElementById('taskModal').close()">Cancel</button>
                <button class="primary" onclick="saveTask()">Save & Close</button>
            </div>
        </div>
    </dialog>

    <script>
        // --- State Management ---
        const DEFAULT_DATA = {
            columns: ["Not started", "In progress", "Done"],
            tasks: [
                { id: "1", text: "Unwrap archway UV using Active Quads", column: "Not started", priority: "High", desc: "Ensure islands are straightened.", checklist: [{text: "Apply stone brick texture", done: false}] },
                { id: "2", text: "Draw barrel plank edge highlights", column: "In progress", priority: "Medium", desc: "Use vector layers and bezier curves.", checklist: [{text: "Base color", done: true}, {text: "Shadow lines", done: true}, {text: "Highlights", done: false}] },
                { id: "3", text: "Bake mantaflow cache for candle fire", column: "Not started", priority: "Low", desc: "Fix physics viewport visibility.", checklist: [] }
            ]
        };

        let data = JSON.parse(localStorage.getItem("todoDataStudio")) || DEFAULT_DATA;
        if (!data.columnColors) data.columnColors = {};
        let activeChecklist = [];

        function saveData() {
            localStorage.setItem("todoDataStudio", JSON.stringify(data));
            renderBoard();
        }

        // --- Rendering ---
        function renderBoard() {
            const board = document.getElementById("board");
            board.innerHTML = "";

            data.columns.forEach((colName, index) => {
                const colTasks = data.tasks.filter(t => t.column === colName);
                
                const colEl = document.createElement("div");
                colEl.className = "column";
                colEl.draggable = true;
                colEl.ondragstart = (e) => colDragStart(e, colName);
                colEl.ondragover = (e) => allowDrop(e);
                colEl.ondrop = (e) => colDrop(e, colName);
                
                // Set custom background color if the user picked one
                colEl.style.backgroundColor = data.columnColors[colName] || 'var(--bg-col)';
                
                // Column Header
                colEl.innerHTML = `
                    <div class="col-header" style="background: rgba(0,0,0,0.2); display: flex; align-items: center;">
                        <span style="flex-grow: 1;">${colName}</span>
                        <div class="col-btn-group">
                            <div class="tiny-color-picker" title="Change Color">
                                <input type="color" value="${data.columnColors[colName] || '#31224A'}" onchange="updateColColor('${colName}', this.value)">
                            </div>
                            <button class="icon-btn add" title="Add Todo" onclick="quickAddTask('${colName}')">+</button>
                            <button class="icon-btn del" title="Delete List" onclick="deleteCol('${colName}')">✕</button>
                        </div>
                        <span class="col-count">${colTasks.length}</span>
                    </div>
                    <div class="card-list" ondragover="allowDrop(event)" ondrop="drop(event, '${colName}')"></div>
                `;

                // Render Tasks
                const listEl = colEl.querySelector(".card-list");
                colTasks.forEach(task => {
                    const card = document.createElement("div");
                    card.className = "card";
                    card.draggable = true;
                    card.ondragstart = (e) => drag(e, task.id);
                    card.onclick = () => openTask(task.id);
                    
                    // CARD ADOPTS COLUMN COLOR (Lightened via a white transparent overlay)
                    card.style.backgroundColor = data.columnColors[colName] || 'var(--bg-card)';
                    card.style.backgroundImage = 'linear-gradient(rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.12))';
                    
                    // Priority Color mapping
                    if(task.priority === "High") card.style.borderLeftColor = "var(--pri-high)";
                    if(task.priority === "Medium") card.style.borderLeftColor = "var(--pri-med)";
                    if(task.priority === "Low") card.style.borderLeftColor = "var(--pri-low)";

                    // STATUS BADGE COLOR LOGIC
                    let statusColor = "var(--text-light)"; 
                    if (task.column === "Not started") statusColor = "#E06C75"; 
                    else if (task.column === "In progress") statusColor = "#6FA8E5"; 
                    else if (task.column === "Done") statusColor = "#7FCB8E"; 

                    let html = `
                        <div style="font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,0.3); color: ${statusColor}; display: inline-block; margin-bottom: 6px;">
                            ${task.column}
                        </div>
                        <div class="card-header">
                            <div class="card-title">${task.text}</div>
                            <button class="card-del-btn" title="Delete Card" onclick="event.stopPropagation(); quickDeleteTask('${task.id}')">✕</button>
                        </div>
                    `;
                    
                    if (task.checklist && task.checklist.length > 0) {
                        const done = task.checklist.filter(c => c.done).length;
                        const pct = (done / task.checklist.length) * 100;
                        
                        // Generate the individual checkboxes
                        let chkHtml = task.checklist.map((c, i) => `
                            <div style="font-size: 12px; margin-top: 4px; display: flex; align-items: center; gap: 6px;">
                                <input type="checkbox" ${c.done ? 'checked' : ''} onclick="event.stopPropagation(); toggleCardCheck('${task.id}', ${i}, this.checked)">
                                <span style="${c.done ? 'text-decoration: line-through; color: var(--text-muted);' : ''}">${c.text}</span>
                            </div>
                        `).join('');

                        // Wrap them in an HTML <details> dropdown so they can be shown/hidden
                        html += `
                            <details onclick="event.stopPropagation()">
                                <summary style="font-size: 12px; color: var(--text-muted); cursor: pointer; outline: none; margin-top: 8px;">Checklist (${done}/${task.checklist.length})</summary>
                                <div style="margin-top: 6px; padding-left: 4px; margin-bottom: 8px;">
                                    ${chkHtml}
                                </div>
                            </details>
                            <div class="progress-bg">
                                <div class="progress-fill ${pct === 100 ? 'done' : ''}" style="width: ${pct}%"></div>
                            </div>
                        `;
                    }
                    card.innerHTML = html;
                    listEl.appendChild(card);
                });

                board.appendChild(colEl);
            });

            // Add List Button
            const addBtn = document.createElement("button");
            addBtn.className = "add-list-btn";
            addBtn.textContent = "+ Add another list";
            addBtn.onclick = () => {
                const name = prompt("List name:");
                if (name && !data.columns.includes(name)) {
                    data.columns.push(name.trim());
                    saveData();
                }
            };
            board.appendChild(addBtn);
        }

        // --- Drag and Drop ---
        function drag(ev, id) {
            ev.dataTransfer.setData("card-id", id);
            ev.target.classList.add('dragging');
            ev.stopPropagation(); 
        }
        
        function allowDrop(ev) { ev.preventDefault(); }
        
        function drop(ev, toCol) {
            ev.preventDefault();
            ev.stopPropagation();
            const id = ev.dataTransfer.getData("card-id");
            if (!id) return; 
            
            const task = data.tasks.find(t => t.id === id);
            if (task && task.column !== toCol) {
                task.column = toCol;
                saveData();
            }
            document.querySelectorAll('.card').forEach(c => c.classList.remove('dragging'));
        }

        function colDragStart(ev, name) {
            ev.dataTransfer.setData("col-name", name);
            ev.target.classList.add('col-dragging');
        }

        function colDrop(ev, targetColName) {
            ev.preventDefault();
            const draggedColName = ev.dataTransfer.getData("col-name");
            if (!draggedColName || draggedColName === targetColName) return;

            const fromIdx = data.columns.indexOf(draggedColName);
            const toIdx = data.columns.indexOf(targetColName);

            data.columns.splice(fromIdx, 1);
            data.columns.splice(toIdx, 0, draggedColName);

            document.querySelectorAll('.column').forEach(c => c.classList.remove('col-dragging'));
            saveData();
        }

        // --- Column Actions ---
        function deleteCol(name) {
            if (data.columns.length <= 1) return alert("You need at least one list.");
            if (confirm(`Delete '${name}' and all its cards?`)) {
                data.tasks = data.tasks.filter(t => t.column !== name);
                data.columns = data.columns.filter(c => c !== name);
                saveData();
            }
        }

        // --- Task Actions ---
        function quickAddTask(col) {
            const text = prompt("Card title:");
            if (text && text.trim()) {
                data.tasks.push({ id: Date.now().toString(), text: text.trim(), column: col, priority: "None", desc: "", checklist: [] });
                saveData();
            }
        }

        // --- Modal Logic ---
        const modal = document.getElementById("taskModal");

        function openTask(id) {
            const task = data.tasks.find(t => t.id === id);
            document.getElementById("editId").value = task.id;
            document.getElementById("editTitle").value = task.text;
            document.getElementById("editDesc").value = task.desc || "";
            document.getElementById("editPri").value = task.priority || "None";
            
            const colSelect = document.getElementById("editCol");
            colSelect.innerHTML = data.columns.map(c => `<option value="${c}">${c}</option>`).join('');
            colSelect.value = task.column;

            activeChecklist = JSON.parse(JSON.stringify(task.checklist || []));
            renderChecklist();
            modal.showModal();
        }

        function renderChecklist() {
            const cont = document.getElementById("chkContainer");
            cont.innerHTML = activeChecklist.map((item, i) => `
                <div class="chk-item">
                    <input type="checkbox" ${item.done ? "checked" : ""} onchange="activeChecklist[${i}].done = this.checked">
                    <span style="flex:1; ${item.done ? 'text-decoration: line-through; color: var(--text-muted);' : ''}">${item.text}</span>
                    <button type="button" onclick="activeChecklist.splice(${i}, 1); renderChecklist()">✕</button>
                </div>
            `).join("");
        }

        function addChecklistItem() {
            const input = document.getElementById("newChkInput");
            if (input.value.trim()) {
                activeChecklist.push({ text: input.value.trim(), done: false });
                input.value = "";
                renderChecklist();
            }
        }

        function saveTask() {
            const id = document.getElementById("editId").value;
            const task = data.tasks.find(t => t.id === id);
            task.text = document.getElementById("editTitle").value;
            task.column = document.getElementById("editCol").value;
            task.priority = document.getElementById("editPri").value;
            task.desc = document.getElementById("editDesc").value;
            task.checklist = activeChecklist;
            modal.close();
            saveData();
        }

        function deleteTask() {
            if (confirm("Permanently delete this card?")) {
                const id = document.getElementById("editId").value;
                data.tasks = data.tasks.filter(t => t.id !== id);
                modal.close();
                saveData();
            }
        }

        function updateColColor(name, color) {
            data.columnColors[name] = color;
            saveData();
        }

        function toggleCardCheck(taskId, chkIndex, isChecked) {
            const task = data.tasks.find(t => t.id === taskId);
            if (task) {
                task.checklist[chkIndex].done = isChecked;
                saveData(); 
            }
        }

        function quickDeleteTask(id) {
            if (confirm("Delete this card?")) {
                data.tasks = data.tasks.filter(t => t.id !== id);
                saveData();
            }
        }

        // Initialize
        renderBoard();
    </script>
</body>
</html>
