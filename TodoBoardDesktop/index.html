                    ensureFinishedAtBottom(task.checklist);
                    insertIdx = task.checklist.length - 2 >= 0 ? task.checklist.length - 2 : 0;
                }

                task.checklistOpen = true;
                syncTaskChecklistTimers(task);
                task.updatedAt = Date.now();
                saveData();
                setTimeout(() => {
                    const el = document.getElementById(`chk-title-${taskId}-${insertIdx}`);
                    if (el) {
                        el.focus();
                        document.execCommand('selectAll', false, null);
                    }
                }, 20);
            }
        }

        function updateChkName(taskId, idx, newText) {
            const task = data.tasks.find(t => t.id === taskId);
            if (task && task.checklist && task.checklist[idx]) {
                const currentText = (task.checklist[idx].text || '').trim().toLowerCase();
                if (currentText === 'started' || currentText === 'finished') return;
                task.checklist[idx].text = newText.trim() || "Untitled Subtask";
                ensureFinishedAtBottom(task.checklist);
                task.updatedAt = Date.now();
                saveData();
            }
        }

        function quickDelCheck(taskId, chkIndex) {
            const task = data.tasks.find(t => t.id === taskId);
            if (task && task.checklist && task.checklist[chkIndex]) {
                const itemText = (task.checklist[chkIndex].text || '').trim().toLowerCase();
                if (itemText === 'started' || itemText === 'finished') return;
                task.checklist.splice(chkIndex, 1);
                ensureFinishedAtBottom(task.checklist);
                syncTaskChecklistTimers(task);
                task.updatedAt = Date.now();
                saveData();
            }
        }

        // --- Task Modal ---
        function openTaskModal(id) {
            const task = data.tasks.find(t => t.id === id);
            if (!task) return;
            editingTaskId = id;

            document.getElementById('modalTaskTitle').value = task.text || '';
            document.getElementById('modalTaskDesc').value = task.desc || '';
            document.getElementById('modalTaskPriority').value = task.priority || 'Low';
            document.getElementById('modalTaskDueDate').value = task.dueDate || '';
            document.getElementById('modalTaskStartDate').value = task.startDate || '';
            document.getElementById('modalTaskCompletedDate').value = task.completedDate || '';
            updateModalDurationInfo();

            // Column options
            const colSelect = document.getElementById('modalTaskColumn');
            colSelect.innerHTML = data.columns.map(c => `<option value="${c}" ${c === task.column ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('');

            modalWorkingTags = [...(task.tags || [])];
            modalWorkingChecklist = (task.checklist || []).map(c => ({ ...c }));
            ensureFinishedAtBottom(modalWorkingChecklist);

            renderModalTags();
            renderModalChecklist();

            document.getElementById('taskModal').classList.add('active');
        }

        function closeTaskModal() {
            document.getElementById('taskModal').classList.remove('active');
            editingTaskId = null;
        }

        function setModalQuickDate(daysToAdd) {
            const d = new Date();
            d.setDate(d.getDate() + daysToAdd);
            const iso = d.toISOString().split('T')[0];
            document.getElementById('modalTaskDueDate').value = iso;
        }

        function clearModalDueDate() {
            document.getElementById('modalTaskDueDate').value = '';
        }

        function renderModalTags() {
            const cont = document.getElementById('modalTagsContainer');
            cont.innerHTML = modalWorkingTags.map((tag, i) => `
                <span class="tag-chip" style="display: inline-flex; align-items: center; gap: 4px;">
                    ${escapeHtml(tag)}
                    <button type="button" class="icon-btn del" onclick="removeModalTag(${i})" style="font-size: 10px; width: 16px; height: 16px; min-width: 16px; min-height: 16px;">✕</button>
                </span>
            `).join('');
        }

        function addModalTag() {
            const inp = document.getElementById('modalTagInput');
            const val = inp.value.trim();
            if (val && !modalWorkingTags.includes(val)) {
                modalWorkingTags.push(val);
                renderModalTags();
            }
            inp.value = '';
        }

        function removeModalTag(idx) {
            modalWorkingTags.splice(idx, 1);
            renderModalTags();
        }

        function syncModalInputsFromChecklist() {
            const total = modalWorkingChecklist.length;
            const done = total ? modalWorkingChecklist.filter(c => c.done).length : 0;
            const startInp = document.getElementById('modalTaskStartDate');
            const endInp = document.getElementById('modalTaskCompletedDate');

            if (total === 0) {
                // No checklist
            } else if (done === 0) {
                startInp.value = '';
                endInp.value = '';
            } else if (done > 0 && done < total) {
                if (!startInp.value) startInp.value = getLocalDateTimeString();
                endInp.value = '';
            } else if (done === total) {
                if (!startInp.value) startInp.value = getLocalDateTimeString();
                if (!endInp.value) endInp.value = getLocalDateTimeString();
            }
            updateModalDurationInfo();
        }

        function handleModalChecklistToggle(idx, isChecked) {
            modalWorkingChecklist[idx].done = isChecked;
            syncModalInputsFromChecklist();
            renderModalChecklist();
        }

        function handleModalChecklistDelete(idx) {
            if (modalWorkingChecklist[idx]) {
                const itemText = (modalWorkingChecklist[idx].text || '').trim().toLowerCase();
                if (itemText === 'started' || itemText === 'finished') return;
                modalWorkingChecklist.splice(idx, 1);
                ensureFinishedAtBottom(modalWorkingChecklist);
                syncModalInputsFromChecklist();
                renderModalChecklist();
            }
        }

        function renderModalChecklist() {
            const cont = document.getElementById('modalChecklistContainer');
            const done = modalWorkingChecklist.filter(c => c.done).length;
            const total = modalWorkingChecklist.length;
            document.getElementById('modalChecklistStats').innerText = `${done} of ${total} completed`;

            cont.innerHTML = modalWorkingChecklist.map((c, i) => {
                const isProtected = ['started', 'finished'].includes((c.text || '').trim().toLowerCase());
                const delBtn = isProtected
                    ? `<span style="width: 22px; height: 22px; min-width: 22px; min-height: 22px; display: inline-block;" title="Required step"></span>`
                    : `<button type="button" class="icon-btn del" onclick="handleModalChecklistDelete(${i})" title="Delete subtask">✕</button>`;
                return `
                    <div style="display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.2); padding: 5px 8px; border-radius: 6px;">
                        <input type="checkbox" style="cursor: pointer; width: 14px; height: 14px; accent-color: var(--accent);" ${c.done ? 'checked' : ''} onchange="handleModalChecklistToggle(${i}, this.checked)">
                        <input type="text" value="${escapeHtml(c.text)}" ${isProtected ? 'readonly' : ''} oninput="modalWorkingChecklist[${i}].text = this.value" onkeydown="if(event.key==='Enter'){this.blur(); event.preventDefault();}" style="flex-grow: 1; padding: 2px 6px; font-size: 12px; font-weight: ${isProtected ? '600' : 'normal'}; ${isProtected ? 'border-color: transparent; background: transparent; cursor: default;' : ''} ${c.done ? 'text-decoration: line-through; opacity: 0.6;' : ''}">
                        ${delBtn}
                    </div>
                `;
            }).join('');
        }

        function addModalChecklistItem() {
            const inp = document.getElementById('modalChecklistInput');
            const val = inp.value.trim();
            if (val) {
                const lastIdx = modalWorkingChecklist.length - 1;
                const lastItem = modalWorkingChecklist[lastIdx];
                if (lastItem && lastItem.text && lastItem.text.trim().toLowerCase() === 'finished') {
                    modalWorkingChecklist.splice(lastIdx, 0, { text: val, done: false });
                } else {
                    modalWorkingChecklist.push({ text: val, done: false });
                    ensureFinishedAtBottom(modalWorkingChecklist);
                }
                syncModalInputsFromChecklist();
                renderModalChecklist();
            }
            inp.value = '';
            inp.focus();
        }

        function saveTaskModal() {
            if (!editingTaskId) return;
            const task = data.tasks.find(t => t.id === editingTaskId);
            if (!task) return;

            task.text = document.getElementById('modalTaskTitle').value.trim() || "Untitled Task";
            task.column = document.getElementById('modalTaskColumn').value;
            task.priority = document.getElementById('modalTaskPriority').value;
            task.dueDate = document.getElementById('modalTaskDueDate').value || null;
            task.startDate = document.getElementById('modalTaskStartDate').value || null;
            task.completedDate = document.getElementById('modalTaskCompletedDate').value || null;
            task.desc = document.getElementById('modalTaskDesc').value.trim();
            task.tags = [...modalWorkingTags];
            task.checklist = [...modalWorkingChecklist];
            ensureFinishedAtBottom(task.checklist);
            syncTaskChecklistTimers(task);
            task.updatedAt = Date.now();

            closeTaskModal();
            saveData();
        }

        function deleteTaskFromModal() {
            if (!editingTaskId) return;
            const id = editingTaskId;
            closeTaskModal();
            quickDeleteTask(id);
        }

        // --- Undo System ---
        function showUndoToast(message, restoreFn) {
            pendingDelete = restoreFn;
            clearTimeout(undoTimeoutId);
            const toast = document.getElementById("undoToast");
            document.getElementById("undoToastMsg").innerText = message;
            toast.classList.add("show");
            undoTimeoutId = setTimeout(() => {
                toast.classList.remove("show");
                pendingDelete = null;
            }, 5000);
        }

        function undoDelete() {
            if (!pendingDelete) return;
            clearTimeout(undoTimeoutId);
            document.getElementById("undoToast").classList.remove("show");
            const restore = pendingDelete;
            pendingDelete = null;
            restore();
        }

        // --- Export & Import Actions ---
        async function handleExportAction(type) {
            document.getElementById('exportAction').value = '';
            if (type === 'json') {
                exportJsonBackup();
            } else if (type === 'csv') {
                exportCsvTasks();
            }
        }

        async function exportJsonBackup() {
            const content = JSON.stringify(boards, null, 2);
            const defaultName = `todoboard_backup_${new Date().toISOString().split('T')[0]}.json`;

            if (window.electronAPI && window.electronAPI.exportFileDialog) {
                const res = await window.electronAPI.exportFileDialog({
                    defaultName,
                    content,
                    filters: [{ name: 'JSON Backup', extensions: ['json'] }]
                });
                if (res && res.success) {
                    showUndoToast(`Saved backup to ${res.filePath}`);
                    return;
                }
            }

            // Browser Fallback
            const blob = new Blob([content], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = defaultName;
            a.click();
            URL.revokeObjectURL(url);
        }

        async function exportCsvTasks() {
            const headers = ["Board", "Column", "Task Title", "Priority", "Status", "Start Date/Time", "End Date/Time", "Duration", "Due Date", "Tags", "Checklist Done", "Checklist Total", "Description"];
            const rows = [headers];

            Object.keys(boards).forEach(bId => {
                const b = boards[bId];
                (b.tasks || []).forEach(t => {
                    const total = t.checklist ? t.checklist.length : 0;
                    const done = total ? t.checklist.filter(c => c.done).length : 0;
                    const status = total > 0 ? (done === total ? "Done" : "In Progress") : (t.completedDate ? "Done" : "Not Started");
                    const dur = calculateDuration(t.startDate, t.completedDate) || '';
                    rows.push([
                        `"${(b.boardTitle || 'Untitled').replace(/"/g, '""')}"`,
                        `"${(t.column || '').replace(/"/g, '""')}"`,
                        `"${(t.text || '').replace(/"/g, '""')}"`,
                        `"${(t.priority || '').replace(/"/g, '""')}"`,
                        `"${status}"`,
                        `"${t.startDate || ''}"`,
                        `"${t.completedDate || ''}"`,
                        `"${dur}"`,
                        `"${t.dueDate || ''}"`,
                        `"${(t.tags || []).join(', ').replace(/"/g, '""')}"`,
                        done,
                        total,
                        `"${(t.desc || '').replace(/"/g, '""')}"`
                    ]);
                });
            });

            const csvContent = rows.map(r => r.join(',')).join('\n');
            const defaultName = `todoboard_tasks_${new Date().toISOString().split('T')[0]}.csv`;

            if (window.electronAPI && window.electronAPI.exportFileDialog) {
                const res = await window.electronAPI.exportFileDialog({
                    defaultName,
                    content: csvContent,
                    filters: [{ name: 'CSV Spreadsheets', extensions: ['csv'] }]
                });
                if (res && res.success) {
                    showUndoToast(`Exported CSV to ${res.filePath}`);
                    return;
                }
            }

            // Browser Fallback
            const blob = new Blob([csvContent], { type: "text/csv" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = defaultName;
            a.click();
            URL.revokeObjectURL(url);
        }

        async function triggerImport() {
            if (window.electronAPI && window.electronAPI.importFileDialog) {
                const res = await window.electronAPI.importFileDialog({
                    filters: [{ name: 'JSON Backup', extensions: ['json'] }]
                });
                if (res && res.success && res.content) {
                    applyImportedJson(res.content);
                    return;
                }
            }

            // Browser fallback file input
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".json";
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => applyImportedJson(evt.target.result);
                reader.readAsText(file);
            };
            input.click();
        }

        function applyImportedJson(rawJson) {
            try {
                const parsed = JSON.parse(rawJson);
                if (parsed.columns && parsed.tasks) {
                    // Single board format
                    const id = "board-" + Date.now();
                    boards[id] = parsed;
                    activeBoardId = id;
                } else if (typeof parsed === 'object' && Object.keys(parsed).length > 0) {
                    // Multi-board format
                    boards = parsed;
                    activeBoardId = Object.keys(boards)[0];
                } else {
                    return alert("Invalid JSON format.");
                }

                saveData();
                switchBoard(activeBoardId);
                showUndoToast("Board data imported successfully!");
            } catch (err) {
                alert("Error importing file: " + err.message);
            }
        }

        // --- Shortcuts Modal ---
        function openShortcutsModal() {
            document.getElementById('shortcutsModal').classList.add('active');
        }
        function closeShortcutsModal() {
            document.getElementById('shortcutsModal').classList.remove('active');
        }

        // Global Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            // Check if user is typing in an input
            const isTyping = ['INPUT', 'TEXTAREA'].includes(e.target.tagName) || e.target.isContentEditable;

            if (e.key === 'Escape') {
                closeTaskModal();
                closeShortcutsModal();
                if (searchQuery) clearSearch();
                return;
            }

            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') {
                e.preventDefault();
                if (data.columns.length > 0) quickAddTask(0);
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') {
                e.preventDefault();
                addBoard();
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                if (!isTyping) {
                    e.preventDefault();
                    undoDelete();
                }
            } else if (e.key === '?' && !isTyping) {
                e.preventDefault();
                openShortcutsModal();
            }
        });
    </script>
</body>
