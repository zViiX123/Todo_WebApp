<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Board Studio</title>
    <style>
        :root {
            --bg-main: #241735; --bg-col: #31224A; --bg-col-head: #3D2A5C;
            --bg-card: #4A3570; --bg-card-hover: #5B4386;
            --text-light: #F1E9FF; --text-muted: #B9A6DE;
            --btn-bg: #5B4386; --btn-hover: #7657B8;
            --danger: #C1667F; --danger-hover: #D84D72;
            --entry-bg: #3D2A5C; --entry-fg: #F1E9FF;
            --pri-high: #E06C75; --pri-med: #E5A66F; --pri-low: #6FA8E5; --pri-none: transparent;
            --accent: #8E5BE8; --accent-glow: rgba(142, 91, 232, 0.4);
            --border-glass: rgba(255, 255, 255, 0.12);
            --modal-bg: #2E1F45;
            --tag-bg: rgba(255, 255, 255, 0.12);
            --color-add: #4ADE80; --color-add-hover: #86EFAC; --color-add-bg: rgba(74, 222, 128, 0.16);
            --color-del: #F87171; --color-del-hover: #FCA5A5; --color-del-bg: rgba(248, 113, 113, 0.16);
        }

        /* Themes */
        [data-theme="dark"] {
            --bg-main: #161719; --bg-col: #222326; --bg-col-head: #2C2D31;
            --bg-card: #35363B; --bg-card-hover: #43444A;
            --text-light: #ECEFF1; --text-muted: #9BA0A5;
            --btn-bg: #3E4149; --btn-hover: #525660;
            --entry-bg: #282A2E; --entry-fg: #ECEFF1;
            --modal-bg: #1F2024; --border-glass: rgba(255, 255, 255, 0.08);
            --color-add: #4ADE80; --color-add-hover: #86EFAC; --color-add-bg: rgba(74, 222, 128, 0.16);
            --color-del: #F87171; --color-del-hover: #FCA5A5; --color-del-bg: rgba(248, 113, 113, 0.16);
        }
        
        [data-theme="blue"] {
            --bg-main: #0B1325; --bg-col: #152238; --bg-col-head: #1E2F4D;
            --bg-card: #273E63; --bg-card-hover: #344F7C;
            --text-light: #E2E8F0; --text-muted: #94A3B8;
            --btn-bg: #334E7B; --btn-hover: #4569A5;
            --entry-bg: #1A2942; --entry-fg: #E2E8F0;
            --modal-bg: #131E33; --border-glass: rgba(255, 255, 255, 0.1);
            --color-add: #4ADE80; --color-add-hover: #A7F3D0; --color-add-bg: rgba(74, 222, 128, 0.18);
            --color-del: #FB7185; --color-del-hover: #FDA4AF; --color-del-bg: rgba(251, 113, 133, 0.18);
        }

        [data-theme="forest"] {
            --bg-main: #0F170F; --bg-col: #172417; --bg-col-head: #213321;
            --bg-card: #2C422C; --bg-card-hover: #3A573A;
            --text-light: #E8F5E9; --text-muted: #95B095;
            --btn-bg: #2F4D2F; --btn-hover: #406840;
            --entry-bg: #1B291B; --entry-fg: #E8F5E9;
            --modal-bg: #152015; --border-glass: rgba(255, 255, 255, 0.1);
            --color-add: #6EE7B7; --color-add-hover: #A7F3D0; --color-add-bg: rgba(110, 231, 183, 0.2);
            --color-del: #FCA5A5; --color-del-hover: #FECACA; --color-del-bg: rgba(252, 165, 165, 0.2);
        }
        
        [data-theme="crimson"] {
            --bg-main: #1D0D0D; --bg-col: #2A1313; --bg-col-head: #3A1B1B;
            --bg-card: #4E2525; --bg-card-hover: #633030;
            --text-light: #FDE8E8; --text-muted: #B89292;
            --btn-bg: #522727; --btn-hover: #6E3434;
            --entry-bg: #2D1818; --entry-fg: #FDE8E8;
            --modal-bg: #220F0F; --border-glass: rgba(255, 255, 255, 0.1);
            --color-add: #4ADE80; --color-add-hover: #86EFAC; --color-add-bg: rgba(74, 222, 128, 0.22);
            --color-del: #FFA4A4; --color-del-hover: #FFD1D1; --color-del-bg: rgba(255, 164, 164, 0.22);
        }

        [data-theme="mocha"] {
            --bg-main: #1D1510; --bg-col: #2B1F17; --bg-col-head: #3A2A20;
            --bg-card: #4D392C; --bg-card-hover: #614838;
            --text-light: #F5EBE1; --text-muted: #B09C8B;
            --btn-bg: #523D2F; --btn-hover: #6B513F;
            --entry-bg: #33261C; --entry-fg: #F5EBE1;
            --modal-bg: #241A13; --border-glass: rgba(255, 255, 255, 0.1);
            --color-add: #6EE7B7; --color-add-hover: #A7F3D0; --color-add-bg: rgba(110, 231, 183, 0.18);
            --color-del: #FCA5A5; --color-del-hover: #FECACA; --color-del-bg: rgba(252, 165, 165, 0.18);
        }

        [data-theme="teal"] {
            --bg-main: #0B1717; --bg-col: #122424; --bg-col-head: #1B3333;
            --bg-card: #254747; --bg-card-hover: #325D5D;
            --text-light: #E0F2F1; --text-muted: #8BB3B3;
            --btn-bg: #274C4C; --btn-hover: #366767;
            --entry-bg: #162E2E; --entry-fg: #E0F2F1;
            --modal-bg: #0F1F1F; --border-glass: rgba(255, 255, 255, 0.1);
            --color-add: #5EEAD4; --color-add-hover: #99F6E4; --color-add-bg: rgba(94, 234, 212, 0.2);
            --color-del: #FDA4AF; --color-del-hover: #FECDD3; --color-del-bg: rgba(253, 164, 175, 0.2);
        }

        [data-theme="sunset"] {
            --bg-main: #1E0E0B; --bg-col: #2D1611; --bg-col-head: #3E1F18;
            --bg-card: #522B22; --bg-card-hover: #69372B;
            --text-light: #FBE9E7; --text-muted: #B88A7D;
            --btn-bg: #5A3026; --btn-hover: #753F32;
            --entry-bg: #361D16; --entry-fg: #FBE9E7;
            --modal-bg: #26120E; --border-glass: rgba(255, 255, 255, 0.1);
            --color-add: #4ADE80; --color-add-hover: #86EFAC; --color-add-bg: rgba(74, 222, 128, 0.18);
            --color-del: #F87171; --color-del-hover: #FCA5A5; --color-del-bg: rgba(248, 113, 113, 0.18);
        }

        [data-theme="nord"] {
            --bg-main: #242933; --bg-col: #2E3440; --bg-col-head: #3B4252;
            --bg-card: #434C5E; --bg-card-hover: #4C566A;
            --text-light: #ECEFF4; --text-muted: #D8DEE9;
            --btn-bg: #4C566A; --btn-hover: #5E6A80;
            --entry-bg: #3B4252; --entry-fg: #ECEFF4;
            --modal-bg: #282E3A; --border-glass: rgba(255, 255, 255, 0.1);
            --color-add: #A3BE8C; --color-add-hover: #C5D8B5; --color-add-bg: rgba(163, 190, 140, 0.22);
            --color-del: #BF616A; --color-del-hover: #D08770; --color-del-bg: rgba(191, 97, 106, 0.22);
        }

        [data-theme="dracula"] {
            --bg-main: #1E1F29; --bg-col: #282A36; --bg-col-head: #343746;
            --bg-card: #44475A; --bg-card-hover: #565A70;
            --text-light: #F8F8F2; --text-muted: #BFBFD4;
            --btn-bg: #6272A4; --btn-hover: #7988B5;
            --entry-bg: #383A4A; --entry-fg: #F8F8F2;
            --modal-bg: #22232E; --border-glass: rgba(255, 255, 255, 0.12);
            --color-add: #50FA7B; --color-add-hover: #8BFAA8; --color-add-bg: rgba(80, 250, 123, 0.2);
            --color-del: #FF5555; --color-del-hover: #FF7777; --color-del-bg: rgba(255, 85, 85, 0.2);
        }

        [data-theme="retro"] {
            --bg-main: #00040A; --bg-col: #070D1A; --bg-col-head: #0E1A33;
            --bg-card: #15264B; --bg-card-hover: #1E376B;
            --text-light: #E0EAFF; --text-muted: #8099CC;
            --btn-bg: #1A3161; --btn-hover: #26468A;
            --entry-bg: #0B152B; --entry-fg: #E0EAFF;
            --modal-bg: #050B16; --border-glass: rgba(255, 255, 255, 0.15);
            --color-add: #33FF77; --color-add-hover: #77FFAA; --color-add-bg: rgba(51, 255, 119, 0.25);
            --color-del: #FF3366; --color-del-hover: #FF7799; --color-del-bg: rgba(255, 51, 102, 0.25);
        }

        [data-theme="viewport"] {
            --bg-main: #141414; --bg-col: #1F1F1F; --bg-col-head: #282828;
            --bg-card: #333333; --bg-card-hover: #404040;
            --text-light: #E5E5E5; --text-muted: #9E9E9E;
            --btn-bg: #383838; --btn-hover: #4A4A4A;
            --entry-bg: #242424; --entry-fg: #E5E5E5;
            --modal-bg: #1A1A1A; --border-glass: rgba(255, 255, 255, 0.08);
            --color-add: #4ADE80; --color-add-hover: #86EFAC; --color-add-bg: rgba(74, 222, 128, 0.18);
            --color-del: #F87171; --color-del-hover: #FCA5A5; --color-del-bg: rgba(248, 113, 113, 0.18);
        }

        [data-theme="engine"] {
            --bg-main: #181818; --bg-col: #222222; --bg-col-head: #2C2C2C;
            --bg-card: #383838; --bg-card-hover: #484848;
            --text-light: #EDEDED; --text-muted: #A8A8A8;
            --btn-bg: #3E3E3E; --btn-hover: #505050;
            --entry-bg: #262626; --entry-fg: #EDEDED;
            --modal-bg: #1C1C1C; --border-glass: rgba(255, 255, 255, 0.08);
            --color-add: #4ADE80; --color-add-hover: #86EFAC; --color-add-bg: rgba(74, 222, 128, 0.18);
            --color-del: #F87171; --color-del-hover: #FCA5A5; --color-del-bg: rgba(248, 113, 113, 0.18);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0; background: var(--bg-main); color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
            user-select: none;
        }

        /* Top Header */
        header {
            background: color-mix(in srgb, var(--bg-col-head) 85%, transparent);
            backdrop-filter: blur(12px);
            padding: 10px 18px;
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
            border-bottom: 1px solid var(--border-glass);
            z-index: 100;
        }

        .header-left, .header-right {
            display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
        }

        .header-center {
            display: flex; align-items: center; gap: 10px; justify-content: center; flex-grow: 1;
        }

        /* Filter & Search Bar */
        #toolbar {
            background: color-mix(in srgb, var(--bg-col) 75%, transparent);
            backdrop-filter: blur(10px);
            padding: 8px 18px;
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            border-bottom: 1px solid var(--border-glass);
            font-size: 13px;
        }

        .search-box {
            position: relative; display: flex; align-items: center;
        }

        .search-box input {
            padding-left: 28px; padding-right: 24px; width: 180px; transition: width 0.25s ease;
            height: 30px; font-size: 13px;
        }
        .search-box input:focus { width: 260px; outline: 1px solid var(--accent); }
        .search-box .search-icon {
            position: absolute; left: 8px; pointer-events: none; opacity: 0.6; font-size: 12px;
        }
        .search-box .clear-btn {
            position: absolute; right: 6px; cursor: pointer; opacity: 0.5; border: none; background: transparent; color: var(--text-light); font-size: 12px; padding: 2px;
        }
        .search-box .clear-btn:hover { opacity: 1; }

        .filter-pill-group {
            display: flex; align-items: center; gap: 4px;
        }

        .filter-pill {
            background: var(--entry-bg); color: var(--text-muted); border: 1px solid var(--border-glass);
            padding: 4px 10px; border-radius: 14px; cursor: pointer; font-size: 12px; font-weight: 500;
            transition: all 0.15s ease;
        }
        .filter-pill:hover { color: var(--text-light); border-color: rgba(255,255,255,0.3); }
        .filter-pill.active {
            background: var(--accent); color: #FFF; border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Board Area */
        #board {
            display: flex; gap: 16px; padding: 18px; flex-grow: 1;
            align-items: flex-start; align-content: flex-start;
            flex-wrap: wrap;
            overflow-y: auto; overflow-x: hidden;
            transition: all 0.2s;
        }

        /* Column */
        .column {
            background: color-mix(in srgb, var(--bg-col) 85%, transparent);
            backdrop-filter: blur(10px);
            border-radius: 10px; width: 300px; min-width: 300px;
            display: flex; flex-direction: column;
            height: calc(100vh - 128px); max-height: calc(100vh - 128px);
            border: 1px solid var(--border-glass);
            transition: width 0.2s ease, min-width 0.2s ease, opacity 0.2s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.18);
        }
        .column.col-dragging { opacity: 0.4; border: 2px dashed var(--text-muted); }
        .column.collapsed {
            width: 48px; min-width: 48px; cursor: pointer;
        }
        .column.collapsed .col-header {
            writing-mode: vertical-rl; transform: rotate(180deg);
            padding: 16px 8px; height: 100%; border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .column.collapsed .col-btn-group,
        .column.collapsed .card-list,
        .column.collapsed .col-quick-add {
            display: none !important;
        }

        .col-header {
            background: rgba(0, 0, 0, 0.22); padding: 10px 14px; border-radius: 10px 10px 0 0;
            display: flex; justify-content: space-between; align-items: center; font-weight: 600;
            border-bottom: 1px solid var(--border-glass);
        }

        .col-count {
            background: rgba(255,255,255,0.12); padding: 2px 7px; border-radius: 12px;
            font-size: 11px; font-weight: 700; margin-left: 6px;
        }
        
        .col-btn-group { display: flex; gap: 4px; align-items: center; }
        
        .icon-btn {
            background: transparent; border: none; font-weight: bold;
            cursor: pointer;
            width: 22px; height: 22px; min-width: 22px; min-height: 22px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 4px; transition: all 0.15s ease;
            color: var(--text-muted); font-size: 12px; line-height: 1; padding: 0;
            box-sizing: border-box;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.12); color: var(--text-light); }
        
        .icon-btn.add {
            color: var(--color-add); font-size: 15px; font-weight: 700;
        }
        .icon-btn.add:hover {
            color: var(--color-add-hover); background: var(--color-add-bg);
            text-shadow: 0 0 6px var(--color-add);
        }
        
        .icon-btn.del {
            color: var(--color-del); font-size: 12px; font-weight: 700;
        }
        .icon-btn.del:hover {
            color: var(--color-del-hover); background: var(--color-del-bg);
            text-shadow: 0 0 6px var(--color-del);
        }

        .tiny-color-picker {
            width: 22px; height: 22px; min-width: 22px; min-height: 22px;
            border-radius: 4px; border: 1px solid rgba(255,255,255,0.25);
            overflow: hidden; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            position: relative; box-sizing: border-box; transition: border-color 0.15s;
        }
        .tiny-color-picker:hover { border-color: rgba(255,255,255,0.5); }
        .tiny-color-picker input[type="color"] {
            position: absolute; top: -5px; left: -5px; width: 32px; height: 32px; cursor: pointer; border: none; opacity: 0;
        }
        
        .card-list {
            padding: 10px; overflow-y: auto; flex-grow: 1; min-height: 50px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .card-list.drag-over {
            background: rgba(255,255,255,0.05); border-radius: 6px;
        }

        /* Task Cards */
        .card {
            background: var(--bg-card); border-radius: 8px; padding: 12px;
            cursor: grab; border: 1px solid rgba(0,0,0,0.3);
            border-left: 4px solid var(--pri-none);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
            position: relative;
        }
        .card:hover {
            filter: brightness(1.15); transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.25);
        }
        .card:active { cursor: grabbing; }
        .card.dragging { opacity: 0.35; transform: scale(0.98); }
        
        .card-top-row {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
        }
        .card-title {
            font-size: 14px; font-weight: 600; word-break: break-word; margin: 0; line-height: 1.35;
        }
        .card-desc-preview {
            font-size: 12px; color: var(--text-muted); margin-top: 5px; line-height: 1.3;
            max-height: 36px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
            -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }
        
        .card-tags {
            display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px;
        }
        .tag-chip {
            background: var(--tag-bg); padding: 2px 6px; border-radius: 4px;
            font-size: 10px; font-weight: 600; letter-spacing: 0.2px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card-meta-row {
            display: flex; align-items: center; justify-content: space-between; gap: 6px;
            margin-top: 8px; font-size: 11px; color: var(--text-muted);
        }
        
        .due-badge {
            display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px;
            border-radius: 4px; font-weight: 600; font-size: 10px;
        }
        .due-badge.overdue { background: rgba(224, 108, 117, 0.25); color: #E06C75; border: 1px solid #E06C75; }
        .due-badge.today { background: rgba(229, 166, 111, 0.25); color: #E5A66F; border: 1px solid #E5A66F; }
        .due-badge.future { background: rgba(255,255,255,0.1); color: var(--text-muted); }

        .progress-bg { background: rgba(0,0,0,0.3); height: 5px; border-radius: 3px; margin-top: 8px; overflow: hidden;}
        .progress-fill { height: 100%; background: var(--pri-med); transition: width 0.3s ease; }
        .progress-fill.done { background: #7FCB8E; }

        .add-list-btn {
            background: rgba(0, 0, 0, 0.15); color: var(--text-muted); border: 2px dashed rgba(255, 255, 255, 0.15); 
            border-radius: 10px; width: 300px; min-width: 300px; height: calc(100vh - 128px);
            display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 40px; font-weight: 300;
            cursor: pointer; transition: all 0.2s ease; gap: 8px;
        }
        .add-list-btn span { font-size: 14px; font-weight: 500; }
        .add-list-btn:hover { 
            background: rgba(0, 0, 0, 0.3); border-color: var(--accent); color: var(--text-light); 
        }

        /* Form Inputs */
        input, select, textarea {
            background: var(--entry-bg); color: var(--entry-fg); border: 1px solid var(--border-glass);
            padding: 6px 10px; border-radius: 6px; font-family: inherit; font-size: 13px;
            outline: none; transition: border-color 0.15s, box-shadow 0.15s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--accent); box-shadow: 0 0 6px var(--accent-glow);
        }
        
        button {
            font-family: inherit; cursor: pointer; transition: all 0.15s ease;
        }
        button.btn {
            background: var(--btn-bg); color: #FFF; border: 1px solid var(--border-glass);
            padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 500;
            display: inline-flex; align-items: center; gap: 6px;
        }
        button.btn:hover { background: var(--btn-hover); }
        button.btn.danger { background: var(--danger); }
        button.btn.danger:hover { background: var(--danger-hover); }

        /* Modal dialog overlay */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(6px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-overlay.active { display: flex; animation: fadeIn 0.2s ease; }

        .modal-card {
            background: var(--modal-bg); border: 1px solid var(--border-glass);
            border-radius: 12px; width: 560px; max-width: 90vw; max-height: 88vh;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 12px 36px rgba(0,0,0,0.5);
            animation: slideUp 0.2s ease;
        }

        .modal-header {
            padding: 16px 20px; border-bottom: 1px solid var(--border-glass);
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-body {
            padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
        }
        .modal-footer {
            padding: 14px 20px; border-top: 1px solid var(--border-glass);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.15);
        }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* Toast */
        #undoToast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: var(--bg-col-head); color: var(--text-light); padding: 10px 18px;
            border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,0.45);
            border: 1px solid var(--border-glass);
            align-items: center; gap: 12px; z-index: 999; display: none;
        }
        #undoToast.show { display: flex; animation: slideUp 0.2s ease; }

        /* Shortcuts Table */
        .shortcuts-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px;
        }
        .shortcut-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 10px; background: rgba(0,0,0,0.2); border-radius: 6px;
        }
        .shortcut-key {
            background: var(--entry-bg); padding: 2px 8px; border-radius: 4px;
            font-family: monospace; font-size: 11px; border: 1px solid var(--border-glass); font-weight: bold;
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        /* Custom themed scrollbars */
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <select id="boardSelect" onchange="switchBoard(this.value)" title="Switch board"></select>
            <button class="btn" onclick="addBoard()" title="New board (Ctrl+B)">＋</button>
            <button class="btn danger" onclick="deleteBoard()" title="Delete board">🗑</button>
        </div>

        <div class="header-center">
            <span id="board-title" contenteditable="true" onblur="updateBoardTitle(this.innerText)" onkeydown="if(event.key==='Enter'){this.blur(); event.preventDefault();}" title="Click to rename board" style="font-size: 18px; font-weight: 700; outline: none; cursor: text;">✦ Todo Board Studio</span>
        </div>

        <div class="header-right">
            <!-- Export dropdown -->
            <select id="exportAction" onchange="handleExportAction(this.value)" title="Export options">
                <option value="" disabled selected>💾 Export / Backup</option>
                <option value="json">Export JSON Backup</option>
                <option value="csv">Export CSV Tasks</option>
            </select>

            <!-- Import -->
            <button class="btn" onclick="triggerImport()" title="Import board data">📂 Import</button>

            <!-- Shortcuts Help -->
            <button class="btn" onclick="openShortcutsModal()" title="Keyboard Shortcuts (?)">⌨️</button>

            <!-- Theme selector -->
            <select id="themeSelect" onchange="changeTheme(this.value)" title="Switch Color Theme">
                <option value="purple">Midnight Purple</option>
                <option value="dark">Classic Dark</option>
                <option value="blue">Slate Blue</option>
                <option value="forest">Forest Green</option>
                <option value="crimson">Crimson Red</option>
                <option value="mocha">Coffee Mocha</option>
                <option value="teal">Ocean Teal</option>
                <option value="sunset">Sunset Orange</option>
                <option value="nord">Nordic Frost</option>
                <option value="dracula">Dracula</option>
                <option value="viewport">3D Viewport Dark</option>
                <option value="engine">Game Engine Graphite</option>
                <option value="retro">Retro Console Boot</option>
            </select>
        </div>
    </header>

    <!-- Toolbar: Search, Filters, Sort -->
    <div id="toolbar">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search tasks... (Ctrl+F)" oninput="handleSearch(this.value)">
            <button class="clear-btn" id="searchClearBtn" onclick="clearSearch()" style="display: none;">✕</button>
        </div>

        <div style="height: 18px; width: 1px; background: var(--border-glass); margin: 0 4px;"></div>

        <!-- Priority Filters -->
        <div class="filter-pill-group">
            <span style="color: var(--text-muted); font-size: 11px; font-weight: 600; margin-right: 4px;">PRIORITY:</span>
            <div class="filter-pill active" data-filter-type="priority" data-value="all" onclick="setPriorityFilter('all')">All</div>
            <div class="filter-pill" data-filter-type="priority" data-value="High" onclick="setPriorityFilter('High')">🔴 High</div>
            <div class="filter-pill" data-filter-type="priority" data-value="Medium" onclick="setPriorityFilter('Medium')">🟡 Med</div>
            <div class="filter-pill" data-filter-type="priority" data-value="Low" onclick="setPriorityFilter('Low')">🔵 Low</div>
        </div>

        <div style="height: 18px; width: 1px; background: var(--border-glass); margin: 0 4px;"></div>

        <!-- Status Filters -->
        <div class="filter-pill-group">
            <span style="color: var(--text-muted); font-size: 11px; font-weight: 600; margin-right: 4px;">STATUS:</span>
            <div class="filter-pill active" data-filter-type="status" data-value="all" onclick="setStatusFilter('all')">All</div>
            <div class="filter-pill" data-filter-type="status" data-value="in-progress" onclick="setStatusFilter('in-progress')">⚡ In Progress</div>
            <div class="filter-pill" data-filter-type="status" data-value="done" onclick="setStatusFilter('done')">✓ Done</div>
            <div class="filter-pill" data-filter-type="status" data-value="overdue" onclick="setStatusFilter('overdue')">⚠️ Overdue</div>
        </div>

        <div style="height: 18px; width: 1px; background: var(--border-glass); margin: 0 4px;"></div>

        <!-- Sort dropdown -->
        <div style="display: flex; align-items: center; gap: 6px; margin-left: auto;">
            <span style="color: var(--text-muted); font-size: 11px; font-weight: 600;">SORT:</span>
            <select id="sortSelect" onchange="changeSort(this.value)" style="padding: 4px 8px; font-size: 12px;">
                <option value="manual">Manual Order</option>
                <option value="dueDate">Due Date (Earliest)</option>
                <option value="priority">Priority (High → Low)</option>
                <option value="title">Title (A-Z)</option>
                <option value="progress">Checklist % Done</option>
            </select>
        </div>
    </div>

    <!-- Kanban Board -->
    <div id="board"></div>

    <!-- Undo Toast Notification -->
    <div id="undoToast">
        <span id="undoToastMsg"></span>
        <button class="btn" onclick="undoDelete()">Undo</button>
    </div>

    <!-- Task Detail & Edit Modal -->
    <div class="modal-overlay" id="taskModal" onclick="if(event.target===this) closeTaskModal()">
        <div class="modal-card">
            <div class="modal-header">
                <span style="font-weight: 700; font-size: 16px;">Task Details</span>
                <button class="icon-btn del" onclick="closeTaskModal()" title="Close">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="modalTaskTitle">TITLE</label>
                    <input type="text" id="modalTaskTitle" placeholder="Task title..." style="font-size: 15px; font-weight: 600;">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="modalTaskColumn">COLUMN</label>
                        <select id="modalTaskColumn"></select>
                    </div>
                    <div class="form-group">
                        <label for="modalTaskPriority">PRIORITY</label>
                        <select id="modalTaskPriority">
                            <option value="High">🔴 High Priority</option>
                            <option value="Medium">🟡 Medium Priority</option>
                            <option value="Low">🔵 Low Priority</option>
                            <option value="None">⚪ None</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="modalTaskDueDate">DUE DATE</label>
                        <input type="date" id="modalTaskDueDate">
                    </div>
                    <div class="form-group">
                        <label>QUICK DUE DATE</label>
                        <div style="display: flex; gap: 6px;">
                            <button type="button" class="btn" style="padding: 5px 8px; font-size: 11px;" onclick="setModalQuickDate(0)">Today</button>
                            <button type="button" class="btn" style="padding: 5px 8px; font-size: 11px;" onclick="setModalQuickDate(1)">Tomorrow</button>
                            <button type="button" class="btn" style="padding: 5px 8px; font-size: 11px;" onclick="setModalQuickDate(7)">+1 Week</button>
                            <button type="button" class="btn danger" style="padding: 5px 8px; font-size: 11px;" onclick="clearModalDueDate()">✕</button>
                        </div>
                    </div>
                </div>

                <!-- Start & End Date / Time Tracking -->
                <div class="form-row">
                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <label for="modalTaskStartDate">START DATE & TIME</label>
                            <button type="button" class="btn" style="padding: 2px 6px; font-size: 10px;" onclick="setModalStartNow()">Now</button>
                        </div>
                        <input type="datetime-local" id="modalTaskStartDate" onchange="updateModalDurationInfo()">
                    </div>
                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <label for="modalTaskCompletedDate">END DATE & TIME</label>
                            <div style="display: flex; gap: 4px;">
                                <button type="button" class="btn" style="padding: 2px 6px; font-size: 10px;" onclick="setModalEndNow()">Now</button>
                                <button type="button" class="btn danger" style="padding: 2px 6px; font-size: 10px;" onclick="clearModalEndDate()">✕</button>
                            </div>
                        </div>
                        <input type="datetime-local" id="modalTaskCompletedDate" onchange="updateModalDurationInfo()">
                    </div>
                </div>
                <div id="modalTaskDurationInfo" style="font-size: 12px; color: var(--text-muted); margin-top: -6px; margin-bottom: 2px; font-weight: 500;"></div>

                <!-- Tags -->
                <div class="form-group">
                    <label>TAGS / CATEGORIES</label>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <input type="text" id="modalTagInput" placeholder="Add tag (Press Enter)..." onkeydown="if(event.key==='Enter'){addModalTag(); event.preventDefault();}" style="flex-grow: 1;">
                        <button type="button" class="btn" onclick="addModalTag()">Add Tag</button>
                    </div>
                    <div id="modalTagsContainer" class="card-tags" style="margin-top: 6px;"></div>
                </div>

                <!-- Description / Notes -->
                <div class="form-group">
                    <label for="modalTaskDesc">DESCRIPTION / NOTES</label>
                    <textarea id="modalTaskDesc" rows="3" placeholder="Add detailed notes or requirements..."></textarea>
                </div>

                <!-- Subtasks / Checklist -->
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label>SUBTASKS & CHECKLIST</label>
                        <span id="modalChecklistStats" style="font-size: 11px; color: var(--text-muted);"></span>
                    </div>
                    <div style="display: flex; gap: 8px; align-items: center; margin-top: 4px;">
                        <input type="text" id="modalChecklistInput" placeholder="Add subtask (Press Enter)..." onkeydown="if(event.key==='Enter'){addModalChecklistItem(); event.preventDefault();}" style="flex-grow: 1;">
                        <button type="button" class="btn" onclick="addModalChecklistItem()">Add Subtask</button>
                    </div>
                    <div id="modalChecklistContainer" style="display: flex; flex-direction: column; gap: 6px; margin-top: 8px; max-height: 180px; overflow-y: auto;"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn danger" onclick="deleteTaskFromModal()">Delete Task</button>
                <div style="display: flex; gap: 8px;">
                    <button class="btn" onclick="closeTaskModal()">Cancel</button>
                    <button class="btn" style="background: var(--accent);" onclick="saveTaskModal()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Keyboard Shortcuts Modal -->
    <div class="modal-overlay" id="shortcutsModal" onclick="if(event.target===this) closeShortcutsModal()">
        <div class="modal-card" style="width: 480px;">
            <div class="modal-header">
                <span style="font-weight: 700; font-size: 16px;">⌨️ Keyboard Shortcuts</span>
                <button class="icon-btn del" onclick="closeShortcutsModal()" title="Close">✕</button>
            </div>
            <div class="modal-body">
                <div class="shortcuts-grid">
                    <div class="shortcut-item"><span>New Task</span><span class="shortcut-key">Ctrl + N</span></div>
                    <div class="shortcut-item"><span>Search Tasks</span><span class="shortcut-key">Ctrl + F</span></div>
                    <div class="shortcut-item"><span>New Board</span><span class="shortcut-key">Ctrl + B</span></div>
                    <div class="shortcut-item"><span>Undo Delete</span><span class="shortcut-key">Ctrl + Z</span></div>
                    <div class="shortcut-item"><span>Close Modal</span><span class="shortcut-key">Escape</span></div>
                    <div class="shortcut-item"><span>Shortcuts Help</span><span class="shortcut-key">?</span></div>
                </div>
            </div>
            <div class="modal-footer" style="justify-content: flex-end;">
                <button class="btn" onclick="closeShortcutsModal()">Got It</button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const DEFAULT_DATA = {
            columns: ["To Do", "In Progress", "Done"],
            tasks: [],
            theme: "purple",
            boardTitle: "✦ Todo Board Studio",
            columnColors: {},
            collapsedCols: []
        };

        let boards = {};
        let activeBoardId = null;
        let data = DEFAULT_DATA;

        let activePriorityFilter = 'all';
        let activeStatusFilter = 'all';
        let searchQuery = '';
        let currentSort = 'manual';
        let editingTaskId = null;
        let modalWorkingTags = [];
        let modalWorkingChecklist = [];

        let pendingDelete = null;
        let undoTimeoutId = null;

        // Escape HTML for safety
        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // --- Data Migration & Helper ---
        function ensureFinishedAtBottom(checklist) {
            if (!Array.isArray(checklist) || checklist.length <= 1) return checklist;
            const finIdx = checklist.findIndex(c => c.text && c.text.trim().toLowerCase() === 'finished');
            if (finIdx !== -1 && finIdx !== checklist.length - 1) {
                const [finItem] = checklist.splice(finIdx, 1);
                checklist.push(finItem);
            }
            return checklist;
        }

        function syncTaskChecklistTimers(task) {
            if (!task) return;
            const total = task.checklist ? task.checklist.length : 0;
            const done = total ? task.checklist.filter(c => c.done).length : 0;

            if (total === 0) {
                // No checklist: do not automatically override manual dates
            } else if (done === 0) {
                // 0 checked -> not started, timer reset
                task.startDate = null;
                task.completedDate = null;
            } else if (done > 0 && done < total) {
                // In progress -> timer starts!
                if (!task.startDate) {
                    task.startDate = getLocalDateTimeString();
                }
                task.completedDate = null;
            } else if (done === total && total > 0) {
                // All checked -> timer ends!
                if (!task.startDate) {
                    task.startDate = getLocalDateTimeString();
                }
                if (!task.completedDate) {
                    task.completedDate = getLocalDateTimeString();
                }
            }
        }

        function sanitizeTask(t) {
            let checklist = Array.isArray(t.checklist) ? t.checklist : [];
            if (checklist.length === 0) {
                checklist = [
                    { text: "Started", done: false },
                    { text: "Finished", done: false }
                ];
            } else {
                ensureFinishedAtBottom(checklist);
            }

            const task = {
                id: t.id || Date.now().toString() + Math.random().toString(36).substr(2, 5),
                text: t.text || "Untitled Task",
                column: t.column || (data.columns[0] || "To Do"),
                priority: t.priority || "Low",
                desc: t.desc || "",
                tags: Array.isArray(t.tags) ? t.tags : [],
                dueDate: t.dueDate || null,
                startDate: t.startDate || null,
                completedDate: t.completedDate || null,
                checklist: checklist,
                checklistOpen: t.checklistOpen !== false,
                createdAt: t.createdAt || Date.now(),
                updatedAt: t.updatedAt || Date.now()
            };
            if (task.checklist && task.checklist.length > 0) {
                syncTaskChecklistTimers(task);
            }
            return task;
        }

        // --- Initialization ---
        (async () => {
            let savedJson = null;
            if (window.electronAPI && window.electronAPI.loadData) {
                savedJson = await window.electronAPI.loadData();
            } else {
                savedJson = localStorage.getItem("todoBoardsStudio");
            }

            if (savedJson) {
                try {
                    boards = JSON.parse(savedJson);
                    activeBoardId = Object.keys(boards)[0];
                } catch (e) {
                    console.error("Data parse error:", e);
                }
            }

            if (!boards || Object.keys(boards).length === 0) {
                const id = "board-" + Date.now();
                boards = { [id]: DEFAULT_DATA };
                activeBoardId = id;
            }

            data = boards[activeBoardId];
            if (!data.theme) data.theme = "purple";
            if (!data.boardTitle) data.boardTitle = "✦ Todo Board Studio";
            if (!data.columnColors) data.columnColors = {};
            if (!data.collapsedCols) data.collapsedCols = [];
            if (!data.tasks) data.tasks = [];
            if (!data.columns) data.columns = ["To Do", "In Progress", "Done"];

            data.tasks = data.tasks.map(sanitizeTask);

            document.documentElement.setAttribute('data-theme', data.theme);
            document.getElementById('themeSelect').value = data.theme;
            document.getElementById('board-title').innerText = data.boardTitle;

            renderBoardSelector();
            renderBoard();
            checkUpcomingDueDates();

            // Tray IPC Listener for Quick Task
            if (window.electronAPI && window.electronAPI.onQuickTask) {
                window.electronAPI.onQuickTask(() => {
                    if (data.columns.length > 0) quickAddTask(0);
                });
            }
        })();

        // --- Persistence ---
        function saveData() {
            boards[activeBoardId] = data;
            const jsonStr = JSON.stringify(boards);
            if (window.electronAPI && window.electronAPI.saveData) {
                window.electronAPI.saveData(jsonStr);
            }
            localStorage.setItem("todoBoardsStudio", jsonStr);
            renderBoardSelector();
            renderBoard();
        }

        // --- Board Operations ---
        function renderBoardSelector() {
            const sel = document.getElementById("boardSelect");
            sel.innerHTML = Object.keys(boards).map(id =>
                `<option value="${id}" ${id === activeBoardId ? 'selected' : ''}>${escapeHtml(boards[id].boardTitle || 'Untitled Board')}</option>`
            ).join('');
        }

        function switchBoard(id) {
            if (!boards[id]) return;
            activeBoardId = id;
            data = boards[activeBoardId];
            if (!data.theme) data.theme = "purple";
            if (!data.boardTitle) data.boardTitle = "✦ Todo Board Studio";
            if (!data.columnColors) data.columnColors = {};
            if (!data.collapsedCols) data.collapsedCols = [];
            if (!data.tasks) data.tasks = [];
            if (!data.columns) data.columns = ["To Do", "In Progress", "Done"];

            data.tasks = data.tasks.map(sanitizeTask);

            document.documentElement.setAttribute('data-theme', data.theme);
            document.getElementById('themeSelect').value = data.theme;
            document.getElementById('board-title').innerText = data.boardTitle;
            renderBoardSelector();
            renderBoard();
        }

        function addBoard() {
            const id = "board-" + Date.now();
            boards[id] = {
                columns: ["To Do", "In Progress", "Done"],
                tasks: [],
                boardTitle: "New Project Board",
                theme: data.theme || "purple",
                columnColors: {},
                collapsedCols: []
            };
            switchBoard(id);
            saveData();
            setTimeout(() => {
                const el = document.getElementById('board-title');
                if (el) { el.focus(); document.execCommand('selectAll', false, null); }
            }, 50);
        }

        function deleteBoard() {
            const ids = Object.keys(boards);
            if (ids.length <= 1) return alert("You need at least one board.");
            if (!confirm(`Delete the board "${data.boardTitle}"? This cannot be undone.`)) return;
            delete boards[activeBoardId];
            switchBoard(Object.keys(boards)[0]);
            saveData();
        }

        function updateBoardTitle(newTitle) {
            data.boardTitle = newTitle.trim() || "✦ Todo Board Studio";
            document.getElementById('board-title').innerText = data.boardTitle;
            saveData();
        }

        function changeTheme(theme) {
            data.theme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            saveData();
        }

        // --- Search & Filters ---
        function handleSearch(val) {
            searchQuery = val.trim().toLowerCase();
            document.getElementById('searchClearBtn').style.display = searchQuery ? 'block' : 'none';
            renderBoard();
        }

        function clearSearch() {
            searchQuery = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('searchClearBtn').style.display = 'none';
            renderBoard();
        }

        function setPriorityFilter(pri) {
            activePriorityFilter = pri;
            document.querySelectorAll('[data-filter-type="priority"]').forEach(el => {
                el.classList.toggle('active', el.getAttribute('data-value') === pri);
            });
            renderBoard();
        }

        function setStatusFilter(status) {
            activeStatusFilter = status;
            document.querySelectorAll('[data-filter-type="status"]').forEach(el => {
                el.classList.toggle('active', el.getAttribute('data-value') === status);
            });
            renderBoard();
        }

        function changeSort(mode) {
            currentSort = mode;
            renderBoard();
        }

        // --- Helper: Date & Time calculations ---
        function getLocalDateTimeString(date = new Date()) {
            const pad = (n) => String(n).padStart(2, '0');
            const y = date.getFullYear();
            const m = pad(date.getMonth() + 1);
            const d = pad(date.getDate());
            const h = pad(date.getHours());
            const min = pad(date.getMinutes());
            return `${y}-${m}-${d}T${h}:${min}`;
        }

        function formatDateTimeDisplay(dtStr) {
            if (!dtStr) return '';
            const date = new Date(dtStr);
            if (isNaN(date.getTime())) return dtStr;
            return date.toLocaleString(undefined, {
                month: 'short',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit'
            });
        }

        function calculateDuration(startStr, endStr) {
            if (!startStr) return null;
            const start = new Date(startStr);
            const end = endStr ? new Date(endStr) : new Date();
            if (isNaN(start.getTime()) || isNaN(end.getTime())) return null;

            const diffMs = end.getTime() - start.getTime();
            if (diffMs < 0) return null;

            const mins = Math.floor(diffMs / (1000 * 60));
            const hours = Math.floor(mins / 60);
            const days = Math.floor(hours / 24);

            if (days > 0) {
                const remHours = hours % 24;
                return `${days}d ${remHours}h`;
            } else if (hours > 0) {
                const remMins = mins % 60;
                return `${hours}h ${remMins}m`;
            } else {
                return `${mins}m`;
            }
        }

        function setModalStartNow() {
            document.getElementById('modalTaskStartDate').value = getLocalDateTimeString();
            updateModalDurationInfo();
        }

        function setModalEndNow() {
            document.getElementById('modalTaskCompletedDate').value = getLocalDateTimeString();
            updateModalDurationInfo();
        }

        function clearModalEndDate() {
            document.getElementById('modalTaskCompletedDate').value = '';
            updateModalDurationInfo();
        }

        function updateModalDurationInfo() {
            const startVal = document.getElementById('modalTaskStartDate').value;
            const endVal = document.getElementById('modalTaskCompletedDate').value;
            const durEl = document.getElementById('modalTaskDurationInfo');
            if (!durEl) return;

            if (startVal && endVal) {
                const dur = calculateDuration(startVal, endVal);
                durEl.innerHTML = dur ? `⏱️ <strong>Completed Duration:</strong> ${dur}` : '';
            } else if (startVal) {
                const dur = calculateDuration(startVal, null);
                durEl.innerHTML = dur ? `⏱️ <strong>In Progress:</strong> ${dur} elapsed` : '';
            } else {
                durEl.innerHTML = '';
            }
        }

        function getDueDateStatus(dueDateStr) {
            if (!dueDateStr) return null;
            const now = new Date();
            now.setHours(0, 0, 0, 0);
            const due = new Date(dueDateStr);
            due.setHours(0, 0, 0, 0);

            const diffTime = due.getTime() - now.getTime();
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays < 0) {
                return { type: 'overdue', label: `${Math.abs(diffDays)}d Overdue` };
            } else if (diffDays === 0) {
                return { type: 'today', label: 'Due Today' };
            } else if (diffDays === 1) {
                return { type: 'future', label: 'Due Tomorrow' };
            } else {
                return { type: 'future', label: `Due in ${diffDays}d` };
            }
        }

        function checkUpcomingDueDates() {
            if (!window.electronAPI || !window.electronAPI.showNotification) return;
            const todayOrOverdue = data.tasks.filter(t => {
                const status = getDueDateStatus(t.dueDate);
                return status && (status.type === 'today' || status.type === 'overdue');
            });

            if (todayOrOverdue.length > 0) {
                window.electronAPI.showNotification({
                    title: `Todo Board: ${todayOrOverdue.length} Tasks Need Attention`,
                    body: `You have ${todayOrOverdue.length} tasks due today or overdue.`
                });
            }
        }

        function isLightColor(hex) {
            if (!hex) return false;
            hex = hex.replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
            const r = parseInt(hex.substr(0, 2), 16) || 0;
            const g = parseInt(hex.substr(2, 2), 16) || 0;
            const b = parseInt(hex.substr(4, 2), 16) || 0;
            return ((0.299 * r + 0.587 * g + 0.114 * b) / 255) > 0.5;
        }

        // --- Rendering ---
        function renderBoard() {
            const board = document.getElementById("board");
            board.innerHTML = "";

            data.columns.forEach((colName, colIdx) => {
                let colTasks = data.tasks.filter(t => t.column === colName);

                // Apply Search Filter
                if (searchQuery) {
                    colTasks = colTasks.filter(t => {
                        const inTitle = t.text.toLowerCase().includes(searchQuery);
                        const inDesc = (t.desc || '').toLowerCase().includes(searchQuery);
                        const inTags = (t.tags || []).some(tag => tag.toLowerCase().includes(searchQuery));
                        const inChecklist = (t.checklist || []).some(c => c.text.toLowerCase().includes(searchQuery));
                        return inTitle || inDesc || inTags || inChecklist;
                    });
                }

                // Apply Priority Filter
                if (activePriorityFilter !== 'all') {
                    colTasks = colTasks.filter(t => t.priority === activePriorityFilter);
                }

                // Apply Status Filter
                if (activeStatusFilter !== 'all') {
                    colTasks = colTasks.filter(t => {
                        const total = t.checklist ? t.checklist.length : 0;
                        const done = total ? t.checklist.filter(c => c.done).length : 0;
                        const pct = total ? (done / total) * 100 : 0;
                        const dueStatus = getDueDateStatus(t.dueDate);

                        if (activeStatusFilter === 'overdue') return dueStatus && dueStatus.type === 'overdue';
                        if (activeStatusFilter === 'done') return pct === 100 && total > 0;
                        if (activeStatusFilter === 'in-progress') return pct > 0 && pct < 100;
                        return true;
                    });
                }

                // Apply Sorting
                if (currentSort === 'dueDate') {
                    colTasks.sort((a, b) => (a.dueDate || '9999') > (b.dueDate || '9999') ? 1 : -1);
                } else if (currentSort === 'priority') {
                    const weight = { 'High': 3, 'Medium': 2, 'Low': 1, 'None': 0 };
                    colTasks.sort((a, b) => (weight[b.priority] || 0) - (weight[a.priority] || 0));
                } else if (currentSort === 'title') {
                    colTasks.sort((a, b) => a.text.localeCompare(b.text));
                } else if (currentSort === 'progress') {
                    const getProgress = t => t.checklist && t.checklist.length ? (t.checklist.filter(c => c.done).length / t.checklist.length) : 0;
                    colTasks.sort((a, b) => getProgress(b) - getProgress(a));
                }

                const colBg = data.columnColors[colName] || getComputedStyle(document.documentElement).getPropertyValue('--bg-col').trim() || '#31224A';
                const textColor = isLightColor(colBg) ? '#111111' : '#F1E9FF';
                const isCollapsed = data.collapsedCols.includes(colName);

                const colEl = document.createElement("div");
                colEl.className = `column ${isCollapsed ? 'collapsed' : ''}`;
                colEl.draggable = !isCollapsed;
                colEl.ondragstart = (e) => colDragStart(e, colName);
                colEl.ondragend = () => { document.querySelectorAll('.column').forEach(c => c.classList.remove('col-dragging')); };
                colEl.ondragover = (e) => allowDrop(e);
                colEl.ondrop = (e) => colDrop(e, colName);
                colEl.style.backgroundColor = colBg;

                if (isCollapsed) {
                    colEl.innerHTML = `
                        <div class="col-header" onclick="toggleCollapseCol('${escapeHtml(colName)}')">
                            <span style="font-weight: 700; color: ${textColor};">${escapeHtml(colName)}</span>
                            <span class="col-count">${colTasks.length}</span>
                        </div>
                    `;
                } else {
                    colEl.innerHTML = `
                        <div class="col-header">
                            <span id="col-title-${colIdx}" contenteditable="true" onblur="updateColName(${colIdx}, this.innerText)" onkeydown="if(event.key==='Enter'){this.blur(); event.preventDefault();}" style="flex-grow: 1; outline: none; cursor: text; color: ${textColor};">${escapeHtml(colName)}</span>
                            <div class="col-btn-group">
                                <div class="tiny-color-picker" title="Change Color">
                                    <input type="color" value="${data.columnColors[colName] || '#31224A'}" onchange="updateColColor(${colIdx}, this.value)">
                                </div>
                                <button class="icon-btn" title="Sort Column" onclick="sortSingleColumn('${escapeHtml(colName)}')">⇅</button>
                                <button class="icon-btn" title="Fold / Collapse Column" onclick="toggleCollapseCol('${escapeHtml(colName)}')">◀</button>
                                <button class="icon-btn add" title="Quick Add Task" onclick="quickAddTask(${colIdx})">+</button>
                                <button class="icon-btn del" title="Delete Column" onclick="deleteCol(${colIdx})">✕</button>
                            </div>
                            <span class="col-count">${colTasks.length}</span>
                        </div>
                        <div class="card-list" ondragover="allowDrop(event); this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="drop(event, ${colIdx}); this.classList.remove('drag-over')"></div>
                    `;

                    const listEl = colEl.querySelector(".card-list");
                    colTasks.forEach(task => {
                        const card = document.createElement("div");
                        card.className = "card";
                        card.draggable = true;
                        card.ondragstart = (e) => drag(e, task.id);
                        card.ondragend = () => {
                            document.querySelectorAll('.card').forEach(c => c.classList.remove('dragging'));
                            document.querySelectorAll('.card-list').forEach(l => l.classList.remove('drag-over'));
                        };
                        card.ondragover = (e) => allowDrop(e);
                        card.ondrop = (e) => cardDrop(e, task.id);
                        card.onclick = (e) => {
                            if (!e.target.closest('button') && !e.target.closest('input') && !e.target.closest('select') && !e.target.isContentEditable) {
                                openTaskModal(task.id);
                            }
                        };

                        card.style.backgroundColor = colBg;
                        card.style.backgroundImage = 'linear-gradient(rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.16))';

                        // Priority color
                        if (task.priority === "High") card.style.borderLeftColor = "var(--pri-high)";
                        else if (task.priority === "Medium") card.style.borderLeftColor = "var(--pri-med)";
                        else if (task.priority === "Low") card.style.borderLeftColor = "var(--pri-low)";
                        else card.style.borderLeftColor = "transparent";

                        // Checklist calculations
                        const total = task.checklist ? task.checklist.length : 0;
                        const done = total ? task.checklist.filter(c => c.done).length : 0;
                        const pct = total ? (done / total) * 100 : 0;

                        // Due date badge
                        const dueStatus = getDueDateStatus(task.dueDate);
                        let dueHtml = '';
                        if (dueStatus) {
                            dueHtml = `<span class="due-badge ${dueStatus.type}">📅 ${dueStatus.label}</span>`;
                        }

                        // Time tracking badges based on checklist state
                        let timeHtml = '';
                        if (total > 0) {
                            if (done === 0) {
                                timeHtml = `<span class="due-badge" style="background: rgba(255,255,255,0.06); color: var(--text-muted);" title="0 of ${total} subtasks completed">⏳ Not Started</span>`;
                            } else if (done > 0 && done < total) {
                                const dur = calculateDuration(task.startDate, null);
                                timeHtml = `<span class="due-badge" style="background: rgba(111, 168, 229, 0.18); color: #6FA8E5; border: 1px solid rgba(111, 168, 229, 0.5);" title="Started ${formatDateTimeDisplay(task.startDate)} (${done}/${total} completed)">⏱️ ${dur || 'In Progress'}</span>`;
                            } else if (done === total) {
                                const dur = calculateDuration(task.startDate, task.completedDate);
                                timeHtml = `<span class="due-badge" style="background: rgba(127, 203, 142, 0.2); color: #7FCB8E; border: 1px solid rgba(127, 203, 142, 0.5);" title="Completed ${formatDateTimeDisplay(task.completedDate)} (All ${total} subtasks done)">🏁 Done</span>`;
                                if (dur) {
                                    timeHtml += `<span class="due-badge" style="background: rgba(255,255,255,0.08); color: var(--text-muted);" title="Duration taken: ${dur}">⏱️ ${dur}</span>`;
                                }
                            }
                        } else {
                            if (task.completedDate) {
                                const dur = calculateDuration(task.startDate, task.completedDate);
                                timeHtml = `<span class="due-badge" style="background: rgba(127, 203, 142, 0.2); color: #7FCB8E; border: 1px solid rgba(127, 203, 142, 0.5);" title="Completed ${formatDateTimeDisplay(task.completedDate)}">🏁 Done</span>`;
                                if (dur) {
                                    timeHtml += `<span class="due-badge" style="background: rgba(255,255,255,0.08); color: var(--text-muted);" title="Duration taken: ${dur}">⏱️ ${dur}</span>`;
                                }
                            } else if (task.startDate) {
                                const dur = calculateDuration(task.startDate, null);
                                timeHtml = `<span class="due-badge" style="background: rgba(111, 168, 229, 0.18); color: #6FA8E5; border: 1px solid rgba(111, 168, 229, 0.5);" title="Started ${formatDateTimeDisplay(task.startDate)}">⏱️ ${dur || 'In Progress'}</span>`;
                            }
                        }

                        // Tags HTML
                        let tagsHtml = '';
                        if (task.tags && task.tags.length > 0) {
                            tagsHtml = `<div class="card-tags">${task.tags.map(tag => `<span class="tag-chip">${escapeHtml(tag)}</span>`).join('')}</div>`;
                        }

                        // Checkbox list
                        let chkHtml = (task.checklist || []).map((c, i) => {
                            const isProtected = ['started', 'finished'].includes((c.text || '').trim().toLowerCase());
                            const delBtn = isProtected
                                ? `<span style="width: 22px; height: 22px; min-width: 22px; min-height: 22px; display: inline-block;"></span>`
                                : `<button class="icon-btn del" title="Delete Subtask" onclick="event.stopPropagation(); quickDelCheck('${task.id}', ${i})">✕</button>`;
                            const isEditable = !isProtected;
                            return `
                                <div class="chk-row" onclick="event.stopPropagation()" style="font-size: 12px; margin-top: 5px; display: flex; align-items: center; gap: 6px;">
                                    <input type="checkbox" style="cursor: pointer; width: 14px; height: 14px; accent-color: var(--accent);" ${c.done ? 'checked' : ''} onclick="event.stopPropagation()" onchange="toggleCardCheck('${task.id}', ${i}, this.checked)">
                                    <span id="chk-title-${task.id}-${i}" contenteditable="${isEditable}" ${isEditable ? `onblur="updateChkName('${task.id}', ${i}, this.innerText)" onkeydown="if(event.key==='Enter'){this.blur(); event.preventDefault();}"` : ''} onclick="event.stopPropagation()" style="flex-grow: 1; outline: none; cursor: ${isEditable ? 'text' : 'default'}; font-weight: ${isProtected ? '600' : 'normal'}; ${c.done ? 'text-decoration: line-through; opacity: 0.55;' : ''}">${escapeHtml(c.text)}</span>
                                    ${delBtn}
                                </div>
                            `;
                        }).join('');

                        card.innerHTML = `
                            <div class="card-top-row">
                                <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
                                    <select onchange="updatePriority('${task.id}', this.value)" onclick="event.stopPropagation()" style="font-size: 10px; font-weight: bold; padding: 2px 4px; border-radius: 4px; background: rgba(0,0,0,0.25); color: inherit; border: none; outline: none; cursor: pointer;">
                                        <option value="High" ${task.priority === 'High' ? 'selected' : ''}>🔴 High</option>
                                        <option value="Medium" ${task.priority === 'Medium' ? 'selected' : ''}>🟡 Med</option>
                                        <option value="Low" ${task.priority === 'Low' || task.priority === 'None' ? 'selected' : ''}>🔵 Low</option>
                                        <option value="None" ${task.priority === 'None' ? 'selected' : ''}>⚪ None</option>
                                    </select>
                                    ${dueHtml}
                                    ${timeHtml}
                                </div>
                                <div style="display: flex; gap: 4px; align-items: center;">
                                    <button class="icon-btn" title="Open Full Details" onclick="event.stopPropagation(); openTaskModal('${task.id}')">✏️</button>
                                    <button class="icon-btn del" title="Delete Card" onclick="event.stopPropagation(); quickDeleteTask('${task.id}')">✕</button>
                                </div>
                            </div>
                            
                            <div id="card-title-${task.id}" class="card-title" contenteditable="true" onblur="updateCardName('${task.id}', this.innerText)" onkeydown="if(event.key==='Enter'){this.blur(); event.preventDefault();}" onclick="event.stopPropagation()" style="outline: none; cursor: text; min-height: 18px;">${escapeHtml(task.text)}</div>
                            
                            ${task.desc ? `<div class="card-desc-preview">${escapeHtml(task.desc)}</div>` : ''}
                            ${tagsHtml}

                            <details ${task.checklistOpen ? 'open' : ''} onclick="event.stopPropagation()" ontoggle="toggleDetails('${task.id}', this.open)" style="margin-top: 8px;">
                                <summary style="font-size: 11px; opacity: 0.85; cursor: pointer; outline: none; display: flex; justify-content: space-between; align-items: center; user-select: none;">
                                    <span>Checklist (${done}/${total})</span>
                                    <button class="icon-btn add" title="Add Subtask" onclick="event.stopPropagation(); event.preventDefault(); quickAddCheck('${task.id}')">+</button>
                                </summary>
                                <div style="margin-top: 4px; padding-left: 2px;">
                                    ${chkHtml}
                                </div>
                            </details>
                            
                            ${total > 0 ? `
                                <div class="progress-bg">
                                    <div class="progress-fill ${pct === 100 ? 'done' : ''}" style="width: ${pct}%"></div>
                                </div>
                            ` : ''}
                        `;
                        listEl.appendChild(card);
                    });
                }

                board.appendChild(colEl);
            });

            // Add Column Button
            const addColBtn = document.createElement("button");
            addColBtn.className = "add-list-btn";
            addColBtn.innerHTML = "+<span>Add Column</span>";
            addColBtn.title = "Add another column";
            addColBtn.onclick = () => {
                let name = "New Column";
                let count = 1;
                while (data.columns.includes(name)) { name = "New Column " + count++; }
                data.columns.push(name);
                saveData();
                setTimeout(() => {
                    const el = document.getElementById(`col-title-${data.columns.length - 1}`);
                    if (el) { el.focus(); document.execCommand('selectAll', false, null); }
                }, 10);
            };
            board.appendChild(addColBtn);
        }

        // --- Drag and drop ---
        function drag(ev, id) {
            ev.dataTransfer.setData("card-id", id);
            ev.target.classList.add('dragging');
            ev.stopPropagation();
        }

        function allowDrop(ev) { ev.preventDefault(); }

        function drop(ev, idx) {
            ev.preventDefault();
            ev.stopPropagation();
            const id = ev.dataTransfer.getData("card-id");
            if (!id) return;

            const toCol = data.columns[idx];
            const task = data.tasks.find(t => t.id === id);
            if (task && task.column !== toCol) {
                task.column = toCol;
                if (toCol.toLowerCase().includes('done') || toCol.toLowerCase().includes('complete')) {
                    if (!task.completedDate) task.completedDate = getLocalDateTimeString();
                }
                task.updatedAt = Date.now();
                saveData();
            }
            document.querySelectorAll('.card').forEach(c => c.classList.remove('dragging'));
        }

        function cardDrop(ev, targetTaskId) {
            ev.preventDefault();
            ev.stopPropagation();
            const id = ev.dataTransfer.getData("card-id");
            if (!id || id === targetTaskId) return;

            const task = data.tasks.find(t => t.id === id);
            const targetTask = data.tasks.find(t => t.id === targetTaskId);
            if (!task || !targetTask) return;

            task.column = targetTask.column;
            if (task.column.toLowerCase().includes('done') || task.column.toLowerCase().includes('complete')) {
                if (!task.completedDate) task.completedDate = getLocalDateTimeString();
            }
            task.updatedAt = Date.now();

            const fromIdx = data.tasks.indexOf(task);
            data.tasks.splice(fromIdx, 1);
            const toIdx = data.tasks.indexOf(targetTask);
            data.tasks.splice(toIdx, 0, task);

            document.querySelectorAll('.card').forEach(c => c.classList.remove('dragging'));
            saveData();
        }

        function colDragStart(ev, name) {
            ev.dataTransfer.setData("col-name", name);
            ev.target.classList.add('col-dragging');
        }

        function colDrop(ev, targetColName) {
            ev.preventDefault();
            const draggedColName = ev.dataTransfer.getData("col-name");
            if (!draggedColName || draggedColName === targetColName) return;

            const fromIdx = data.columns.indexOf(draggedColName);
            const toIdx = data.columns.indexOf(targetColName);

            data.columns.splice(fromIdx, 1);
            data.columns.splice(toIdx, 0, draggedColName);

            document.querySelectorAll('.column').forEach(c => c.classList.remove('col-dragging'));
            saveData();
        }

        function toggleCollapseCol(colName) {
            const idx = data.collapsedCols.indexOf(colName);
            if (idx > -1) {
                data.collapsedCols.splice(idx, 1);
            } else {
                data.collapsedCols.push(colName);
            }
            saveData();
        }

        function sortSingleColumn(colName) {
            const colTasks = data.tasks.filter(t => t.column === colName);
            colTasks.sort((a, b) => a.text.localeCompare(b.text));
            data.tasks = data.tasks.filter(t => t.column !== colName).concat(colTasks);
            saveData();
        }

        function updateColColor(idx, color) {
            const name = data.columns[idx];
            data.columnColors[name] = color;
            saveData();
        }

        function deleteCol(idx) {
            if (data.columns.length <= 1) return alert("You need at least one column.");
            const name = data.columns[idx];
            const removedTasks = data.tasks.filter(t => t.column === name);
            const color = data.columnColors[name];

            data.columns.splice(idx, 1);
            data.tasks = data.tasks.filter(t => t.column !== name);
            delete data.columnColors[name];

            showUndoToast(`Deleted column "${name}"`, () => {
                data.columns.splice(idx, 0, name);
                data.tasks.push(...removedTasks);
                if (color) data.columnColors[name] = color;
                saveData();
            });
            saveData();
        }

        function updateColName(idx, newName) {
            const oldName = data.columns[idx];
            newName = newName.trim();
            if (!newName || newName === oldName || data.columns.includes(newName)) return renderBoard();

            data.columns[idx] = newName;
            data.tasks.forEach(t => { if (t.column === oldName) t.column = newName; });
            if (data.columnColors[oldName]) {
                data.columnColors[newName] = data.columnColors[oldName];
                delete data.columnColors[oldName];
            }
            if (data.collapsedCols && data.collapsedCols.includes(oldName)) {
                data.collapsedCols = data.collapsedCols.map(c => c === oldName ? newName : c);
            }
            saveData();
        }

        // --- Task Inline Operations ---
        function updateCardName(id, newText) {
            const task = data.tasks.find(t => t.id === id);
            if (task) {
                task.text = newText.trim() || "Untitled Task";
                task.updatedAt = Date.now();
                saveData();
            }
        }

        function updatePriority(id, pri) {
            const task = data.tasks.find(t => t.id === id);
            if (task) {
                task.priority = pri;
                task.updatedAt = Date.now();
                saveData();
            }
        }

        function toggleCardCheck(taskId, chkIndex, isChecked) {
            const task = data.tasks.find(t => t.id === taskId);
            if (task && task.checklist && task.checklist[chkIndex]) {
                task.checklist[chkIndex].done = isChecked;
                syncTaskChecklistTimers(task);
                task.updatedAt = Date.now();
                saveData();
            }
        }

        function toggleDetails(taskId, isOpen) {
            const task = data.tasks.find(t => t.id === taskId);
            if (task && task.checklistOpen !== isOpen) {
                task.checklistOpen = isOpen;
                boards[activeBoardId] = data;
                const jsonStr = JSON.stringify(boards);
                if (window.electronAPI && window.electronAPI.saveData) {
                    window.electronAPI.saveData(jsonStr);
                }
                localStorage.setItem("todoBoardsStudio", jsonStr);
            }
        }

        function quickAddTask(colIdx) {
            const col = data.columns[colIdx] || data.columns[0];
            const id = Date.now().toString();
            const newTask = sanitizeTask({
                id,
                text: "New Task",
                column: col,
                priority: "Low",
                checklist: [],
                checklistOpen: true
            });
            data.tasks.push(newTask);
            saveData();
            setTimeout(() => {
                const el = document.getElementById(`card-title-${id}`);
                if (el) { el.focus(); document.execCommand('selectAll', false, null); }
            }, 10);
        }

        function quickDeleteTask(id) {
            const idx = data.tasks.findIndex(t => t.id === id);
            if (idx === -1) return;
            const [removed] = data.tasks.splice(idx, 1);
            showUndoToast(`Deleted "${removed.text}"`, () => {
                data.tasks.splice(idx, 0, removed);
                saveData();
            });
            saveData();
        }

        function quickAddCheck(taskId) {
            const task = data.tasks.find(t => t.id === taskId);
            if (task) {
                if (!task.checklist || task.checklist.length === 0) {
                    task.checklist = [
                        { text: "Started", done: false },
                        { text: "Finished", done: false }
                    ];
                }
                const lastIdx = task.checklist.length - 1;
                const lastItem = task.checklist[lastIdx];
                let insertIdx = task.checklist.length;

                // Always insert new items above the "Finished" item so Finished stays at the bottom
                if (lastItem && lastItem.text && lastItem.text.trim().toLowerCase() === 'finished') {
                    insertIdx = lastIdx;
                    task.checklist.splice(insertIdx, 0, { text: "New Subtask", done: false });
                } else {
                    task.checklist.push({ text: "New Subtask", done: false });
