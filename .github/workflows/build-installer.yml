name: Build Windows Installer & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer & Portable Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: TodoBoardDesktop/package-lock.json

      - name: Install Dependencies
        working-directory: ./TodoBoardDesktop
        run: npm ci

      - name: Build Windows Installer (NSIS & Portable)
        working-directory: ./TodoBoardDesktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Todo-Board-Studio-Windows-Binaries
          path: |
            TodoBoardDesktop/dist/*.exe
            TodoBoardDesktop/dist/*.blockmap
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Todo Board Studio ${{ github.ref_name || 'v1.0.0' }}
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            TodoBoardDesktop/dist/*.exe
            TodoBoardDesktop/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
