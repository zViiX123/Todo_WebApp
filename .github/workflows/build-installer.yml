name: Build Desktop Installers & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer & Portable Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: TodoBoardDesktop/package-lock.json

      - name: Install Dependencies
        working-directory: ./TodoBoardDesktop
        run: npm ci

      - name: Build Windows Installer (NSIS & Portable)
        working-directory: ./TodoBoardDesktop
        run: npm run build

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Todo-Board-Studio-Windows-Binaries
          path: |
            TodoBoardDesktop/dist/*.exe
            TodoBoardDesktop/dist/*.blockmap
          retention-days: 30

  build-mac:
    name: Build macOS DMG Installer & ZIP
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: TodoBoardDesktop/package-lock.json

      - name: Install Dependencies
        working-directory: ./TodoBoardDesktop
        run: npm ci

      - name: Build macOS DMG & ZIP (Apple Silicon & Intel)
        working-directory: ./TodoBoardDesktop
        run: npm run build:mac

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Todo-Board-Studio-macOS-Binaries
          path: |
            TodoBoardDesktop/dist/*.dmg
            TodoBoardDesktop/dist/*.zip
            TodoBoardDesktop/dist/*.blockmap
          retention-days: 30

  release:
    name: Publish Multi-Platform GitHub Release
    needs: [build-windows, build-mac]
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Release Assets Directory
        run: mkdir -p release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Todo-Board-Studio-Windows-Binaries
          path: release-assets

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Todo-Board-Studio-macOS-Binaries
          path: release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Todo Board Studio ${{ github.ref_name || 'v4.1.2' }}
          tag_name: ${{ github.ref_name || 'v4.1.2' }}
          draft: false
          prerelease: false
          overwrite: true
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
